services:
  mongo:
    image: mongo:8
    container_name: synitheia-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # A single-node replica set is required: transactions (used to write a domain
    # record and its PersonalEvent atomically) are unavailable on standalone mongod.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
